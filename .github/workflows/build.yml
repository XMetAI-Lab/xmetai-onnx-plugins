name: Build Plugin

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: [self-hosted, gpu]
    env:
      ORT_PACKAGE_DIR: /workspace/github/onnxruntime-linux-x64-gpu-1.23.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build environment
        run: |
          python --version
          python -m pip --version
          nvcc -V
          test -d "$ORT_PACKAGE_DIR/include"
          test -d "$ORT_PACKAGE_DIR/lib"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build packaging ninja

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Smoke import extension
        env:
          LD_LIBRARY_PATH: "/workspace/github/onnxruntime-linux-x64-gpu-1.23.2/lib:${{ env.LD_LIBRARY_PATH }}"
        run: |
          python -m pip install dist/*.whl
          python -c "import xmetai_onnx_plugins; print(xmetai_onnx_plugins.__name__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: xmetai-onnx-plugins-wheel
          path: dist/*.whl
          if-no-files-found: error
