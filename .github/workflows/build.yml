name: Build Plugin

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: [self-hosted, gpu]
    strategy:
      fail-fast: false
      matrix:
        build_target:
          - name: ort-1.27.0-cuda13
            ort_package_dir: /workspace/github/onnxruntime-linux-x64-gpu_cuda13-1.27.0
            cuda_home: /usr/local/cuda-13.1
            cuda_include: /usr/local/cuda-13.1/targets/x86_64-linux/include
            cuda_lib: /usr/local/cuda-13.1/targets/x86_64-linux/lib
          - name: ort-1.26.0-cuda12
            ort_package_dir: /workspace/github/onnxruntime-linux-x64-gpu-1.26.0
            cuda_home: /home/douzsh/anaconda/envs/h100
            cuda_include: /home/douzsh/anaconda/envs/h100/targets/x86_64-linux/include
            cuda_lib: /home/douzsh/anaconda/envs/h100/targets/x86_64-linux/lib
    env:
      ORT_PACKAGE_DIR: ${{ matrix.build_target.ort_package_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build extension
        run: |
          test -d "$ORT_PACKAGE_DIR/include"
          test -d "$ORT_PACKAGE_DIR/lib"
          export CUDA_HOME="${{ matrix.build_target.cuda_home }}"
          export PATH="$CUDA_HOME/bin:$PATH"
          export CPATH="${{ matrix.build_target.cuda_include }}:${CPATH:-}"
          export CPLUS_INCLUDE_PATH="${{ matrix.build_target.cuda_include }}:${CPLUS_INCLUDE_PATH:-}"
          export LIBRARY_PATH="${{ matrix.build_target.cuda_lib }}:${LIBRARY_PATH:-}"
          export LD_LIBRARY_PATH="${{ matrix.build_target.cuda_lib }}:${LD_LIBRARY_PATH:-}"
          test -x "$CUDA_HOME/bin/nvcc"
          test -f "${{ matrix.build_target.cuda_include }}/cuda_runtime_api.h"
          nvcc -V
          python setup.py clean --all
          rm -f xmetai_onnx_plugins*.so
          python setup.py build_ext --inplace

      - name: Upload extension artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: xmetai-onnx-plugins-so-${{ matrix.build_target.name }}
          path: xmetai_onnx_plugins*.so
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xmetai-onnx-plugins-so-*
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Prebuilt plugins

            This release provides two Linux x86-64 ONNX Runtime custom-op shared libraries:

            - **ORT 1.27.0 / CUDA 13.1** — built for `sm_80`, `sm_86`, `sm_89`, `sm_90`, and `sm_120`.
            - **ORT 1.26.0 / CUDA 12.6** — built for `sm_70`, `sm_80`, `sm_86`, `sm_89`, and `sm_90`.

            Select the artifact matching the installed ONNX Runtime, CUDA runtime, and Python ABI. The supported GPU families include V100, A800, H100, GeForce RTX 3080/3090, RTX 4080/4090, and RTX 5080/5090.
          files: release-assets/**/*.so
          fail_on_unmatched_files: true
